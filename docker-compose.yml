# AgroAnálisis Sugamuxi - orquestación
# Solo el contenedor 'proxy' publica un puerto (80). La base de datos, la app y el worker
# quedan en redes internas de Docker y NO son accesibles desde Internet.
#
# SECRETOS: app y worker NO reciben el .env completo; solo las variables que necesitan.
# En particular, ninguno recibe POSTGRES_PASSWORD (la del superusuario de la base de datos):
# cada uno se conecta con su propio usuario de mínimo privilegio (agro_web / agro_worker).
#
# =====================================================================================
#  LÍMITES DE RECURSOS (reto 4: cambiar aquí y aplicar con  docker compose up -d <servicio>)
#
#   servicio   RAM (mem_limit)   CPU (cpus)   procesos (pids_limit)
#   proxy        64m               0.25          50
#   app         256m               0.50          64
#   worker      256m               0.50          50
#   db          256m               0.50         100
#   TOTAL       832 MB  -> cabe en una t2.micro (1 GB) dejando ~190 MB al sistema operativo.
#   En una t3.small (2 GB) se pueden duplicar: app/worker 512m, db 512m (ver README).
#
#  memswap_limit = mem_limit: el contenedor NO usa swap; al pasarse, el kernel mata el proceso (OOM).
#  Comprobar:  docker inspect -f '{{.Name}} mem={{.HostConfig.Memory}} cpus={{.HostConfig.NanoCpus}} pids={{.HostConfig.PidsLimit}}' $(docker compose ps -q)
#              docker stats --no-stream      (o el panel "Recursos" de la app, que lee /sys/fs/cgroup)
# =====================================================================================

name: agroanalisis

# Variables comunes de la app (parámetros de reglas de negocio incluidos).
x-entorno-app: &entorno-app
  POSTGRES_DB: ${POSTGRES_DB}
  DB_HOST: db
  DB_USER: agro_web
  DB_PASSWORD: ${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD en .env (ver scripts/aplicar_migraciones.sh)}
  SECRET_KEY: ${SECRET_KEY}
  ADMIN_USER: ${ADMIN_USER:-coordinador}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}
  MAX_MB: ${MAX_MB:-2}
  LATIDO_CADUCO_S: ${LATIDO_CADUCO_S:-60}
  # Reglas de negocio: parámetros y encendido/apagado sin reconstruir (vacío = valor de reglas_negocio.py)
  MAX_ACTIVOS_USUARIO: ${MAX_ACTIVOS_USUARIO:-3}
  CABECERA_CSV: ${CABECERA_CSV:-}
  REGLA_CUOTA_TRABAJOS_ACTIVOS: ${REGLA_CUOTA_TRABAJOS_ACTIVOS:-}
  REGLA_BLOQUEAR_BORRADO_FINALIZADOS: ${REGLA_BLOQUEAR_BORRADO_FINALIZADOS:-}
  REGLA_CABECERA_CSV_OBLIGATORIA: ${REGLA_CABECERA_CSV_OBLIGATORIA:-}
  REGLA_RANGOS_AGRONOMICOS_VALIDOS: ${REGLA_RANGOS_AGRONOMICOS_VALIDOS:-}
  REGLA_TAMANO_MAXIMO_POR_ROL: ${REGLA_TAMANO_MAXIMO_POR_ROL:-}
  REGLA_VENTANA_RECEPCION: ${REGLA_VENTANA_RECEPCION:-}
  REGLA_BLOQUEAR_DESCARGA_ORIGINALES_AJENOS: ${REGLA_BLOQUEAR_DESCARGA_ORIGINALES_AJENOS:-}
  REGLA_TRABAJOS_CONFIDENCIALES: ${REGLA_TRABAJOS_CONFIDENCIALES:-}
  REGLA_LIMITE_REPROCESOS: ${REGLA_LIMITE_REPROCESOS:-}

# Endurecimiento común: sin capacidades del kernel, sin escalar privilegios (setuid), raíz de solo lectura
x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:

  proxy:                                  # Proxy inverso: única puerta de entrada
    <<: *endurecido
    # Imagen fijada por digest (reproducible). Para actualizar: docker buildx imagetools inspect <imagen:tag>
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    ports:
      - "80:8080"                         # ÚNICO puerto publicado (HTTP). 8080 dentro: nginx sin root no usa <1024
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, frontend]
    depends_on:
      app:
        condition: service_healthy
    tmpfs: ["/tmp:size=16m,mode=1777,nosuid,nodev"]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/salud-proxy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:                                    # Aplicación web / API (Flask + Gunicorn)
    <<: *endurecido
    build: ./app
    environment: *entorno-app
    volumes:
      - datos:/data
    networks: [frontend, backend]         # ninguna de las dos tiene salida a Internet
    depends_on:
      db:
        condition: service_healthy
    tmpfs: ["/tmp:size=32m,mode=1777,nosuid,nodev"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:                                 # Trabajador de procesamiento asíncrono
    <<: *endurecido
    build: ./worker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      DB_USER: agro_worker
      DB_PASSWORD: ${WORKER_DB_PASSWORD:?Falta WORKER_DB_PASSWORD en .env (ver scripts/aplicar_migraciones.sh)}
      PROCESAMIENTO_DEMORA_S: ${PROCESAMIENTO_DEMORA_S:-3}
      MAX_INTENTOS: ${MAX_INTENTOS:-3}
      TIMEOUT_TRABAJO_S: ${TIMEOUT_TRABAJO_S:-120}
      LATIDO_CADUCO_S: ${LATIDO_CADUCO_S:-60}
    volumes:
      - datos:/data
    networks: [backend]                   # sin salida a Internet
    depends_on:
      db:
        condition: service_healthy
    tmpfs: ["/tmp:size=16m,mode=1777,nosuid,nodev"]
    mem_limit: 256m                       # un archivo pesado no tumba el servidor: el OOM mata solo al worker
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 50
    healthcheck:                          # sano si dio señal de vida (latido) en los últimos 30 s
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/latido') < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:                                     # PostgreSQL: usuarios, trabajos y auditoría
    <<: *endurecido
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    # El entrypoint arranca como root solo para ajustar permisos del volumen y luego baja al usuario
    # 'postgres' (UID 70). Esas son las ÚNICAS capacidades que necesita para hacerlo:
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}            # superusuario: solo para esquema y migraciones
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}        # para crear agro_web (db/02_roles.sh)
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}  # para crear agro_worker
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/02_roles.sh:/docker-entrypoint-initdb.d/02_roles.sh:ro
      - ./db/roles.sql:/srv/db/roles.sql:ro
    networks: [backend]                   # sin "ports": NO expuesto fuera de Docker
    tmpfs:
      - "/var/run/postgresql:size=1m,uid=70,gid=70,mode=0775"
      - "/tmp:size=32m,mode=1777,nosuid,nodev"
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge: {}                                # Internet <-> proxy (la única red con salida)
  frontend:
    internal: true                        # proxy <-> app, sin acceso a Internet
  backend:
    internal: true                        # app <-> worker <-> db, sin acceso a Internet

volumes:
  db_data: {}                             # datos de PostgreSQL (persisten al reiniciar y con "down")
  datos: {}                               # archivos originales y resultados (/data)
