# Proxy inverso de AgroAnálisis Sugamuxi

# Máximo 10 intentos de login por minuto por IP (freno a ataques de fuerza bruta).
# Solo cuentan los POST (enviar contraseña); abrir la página de login (GET) no gasta intentos.
map $request_method $clave_limite_login {
    POST    $binary_remote_addr;
    default "";                              # clave vacía = sin límite
}
limit_req_zone $clave_limite_login zone=login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;                       # no revelar la versión de nginx

    client_max_body_size 3m;                 # la app aplica el límite exacto (2 MB)

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Solo se ejecuta JavaScript servido por la propia app (static/estado.js); nunca código en línea.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Healthcheck del propio proxy (no depende de la app)
    location = /salud-proxy {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @demasiados_intentos;
        proxy_pass http://app:5000;
    }

    location / {
        proxy_pass http://app:5000;
    }

    location @demasiados_intentos {
        default_type text/html;
        add_header Retry-After 60 always;
        return 429 '<!doctype html><html lang="es"><meta charset="utf-8"><title>Demasiados intentos</title><body style="font-family:system-ui;max-width:32rem;margin:4rem auto;padding:0 1rem"><h1>Demasiados intentos de ingreso</h1><p>Por seguridad se limitan los intentos de inicio de sesión a 10 por minuto. Espere un minuto e intente de nuevo.</p><p><a href="/login">Volver al ingreso</a></p></body></html>';
    }
}
