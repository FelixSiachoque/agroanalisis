{% extends "base.html" %}
{% block contenido %}
<section class="tarjeta">
  <h1>Auditoría · quién hizo qué y cuándo</h1>
  <form method="get" class="fila">
    <input name="usuario" placeholder="filtrar por usuario" value="{{ fu }}">
    <select name="accion">
      <option value="">todas las acciones</option>
      {% for a in acciones %}<option value="{{ a.accion }}" {{ 'selected' if a.accion == fa }}>{{ a.accion }} ({{ a.n }})</option>{% endfor %}
    </select>
    <button>Filtrar</button>
    <a class="boton" href="{{ url_for('auditoria_csv', usuario=fu, accion=fa) }}">⬇ Exportar reporte CSV</a>
  </form>
  <table>
    <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th><th>IP</th></tr>
    {% for e in eventos %}
    <tr class="acc-{{ e.accion }}">
      <td>{{ e.fecha.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ e.usuario }}</td>
      <td><code>{{ e.accion }}</code></td><td>{{ e.detalle }}</td><td>{{ e.ip or '' }}</td>
    </tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
