{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta login-caja">
  <h1>Ingresar</h1>
  <p class="sutil">Laboratorio de análisis de suelos. Cada persona entra con su propia cuenta.</p>
  <form method="post" novalidate>
    {{ csrf_campo() }}
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" required autocomplete="username" autofocus maxlength="50">
    </div>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" required autocomplete="current-password">
    </div>
    <button type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
